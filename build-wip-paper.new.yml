name: Build WIP Paper

on:
  push:
    branches:
      - main
    paths:
      - 'wip-paper/**'
      - 'images/**'
      - '.github/workflows/build-wip-paper.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    name: Build novedu-wip.pdf
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            librsvg2-bin \
            lmodern \
            poppler-utils \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended

      - name: Convert SVG figures to PDF
        run: |
          mkdir -p wip-paper/figures
          rsvg-convert --format pdf \
            --output wip-paper/figures/NoveduApproachesComparison.pdf \
            images/NoveduApproachesComparison.paper.svg

      - name: Build PDF
        working-directory: wip-paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error novedu-wip
          bibtex novedu-wip
          pdflatex -interaction=nonstopmode -halt-on-error novedu-wip
          pdflatex -interaction=nonstopmode -halt-on-error novedu-wip

      - name: Check page limit (8 pages incl. bibliography)
        run: |
          PAGES=$(pdfinfo wip-paper/novedu-wip.pdf | awk '/^Pages:/ {print $2}')
          echo "PDF has $PAGES pages"
          if [ "$PAGES" -gt 8 ]; then
            echo "::error::novedu-wip.pdf has $PAGES pages, exceeding the 8-page limit."
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: novedu-wip-pdf
          path: wip-paper/novedu-wip.pdf
          if-no-files-found: error

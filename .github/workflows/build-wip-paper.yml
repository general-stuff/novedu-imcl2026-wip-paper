name: Build WIP Paper

on:
  push:
    branches:
      - main
    paths:
      - 'wip-paper/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    name: Build novedu-wip.pdf
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            lmodern \
            texlive-bibtex-extra \
            texlive-fonts-recommended \
            texlive-latex-base \
            texlive-latex-extra \
            texlive-latex-recommended

      - name: Build PDF
        working-directory: wip-paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error novedu-wip
          bibtex novedu-wip
          pdflatex -interaction=nonstopmode -halt-on-error novedu-wip
          pdflatex -interaction=nonstopmode -halt-on-error novedu-wip

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: novedu-wip-pdf
          path: wip-paper/novedu-wip.pdf
          if-no-files-found: error
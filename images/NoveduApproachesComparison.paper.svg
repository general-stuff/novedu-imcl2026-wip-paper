<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 872 542" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of the legacy and integrated Novedu approaches</title>
  <desc id="desc">The legacy approach uses separate Open WebUI and LiteLLM components. The Novedu approach combines the web application and LLM proxy and contains Tutor, Quizzes, Writing, and Coding activities.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
    <style>
      text { font-family: Helvetica, Arial, sans-serif; fill: #17202a; }
      .panel { fill: #fcfcfa; stroke: #a4abb4; stroke-width: 1.4; }
      .panel-title { font-size: 21px; font-weight: 600; }
      .panel-tag { font-size: 17px; font-weight: 700; }
      .node { fill: #fff; stroke: #5f6874; stroke-width: 1.5; }
      .legacy-node { fill: #f5f5f5; }
      .actor-node { fill: #fffbeb; stroke: #8a6d00; }
      .provider-node { fill: #f7f7f7; }
      .novedu-node { fill: #edf3f8; stroke: #315d87; stroke-width: 1.8; }
      .activity { fill: #fff; stroke: #7d93a8; stroke-width: 1.1; }
      .node-label { font-size: 19px; font-weight: 600; text-anchor: middle; }
      .node-label-small { font-size: 17px; font-weight: 600; text-anchor: middle; }
      .role-label { font-size: 15px; text-anchor: middle; fill: #425466; }
      .activity-label { font-size: 16px; font-weight: 600; text-anchor: middle; }
      .flow { fill: none; stroke: #374151; stroke-width: 1.6; marker-start: url(#arrow); marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="14" y="14" width="872" height="542" fill="#fff"/>

  <!-- (a) Legacy approach -->
  <rect class="panel" x="20" y="20" width="860" height="222" rx="8"/>
  <text class="panel-tag" x="42" y="49">(a)</text>
  <text class="panel-title" x="80" y="49">Legacy: separate web UI and LLM proxy</text>
  <!-- The upper flow is a fully aligned row. -->
  <line class="flow" x1="180" y1="99" x2="250" y2="99"/>
  <line class="flow" x1="390" y1="99" x2="470" y2="99"/>
  <line class="flow" x1="590" y1="99" x2="690" y2="99"/>
  <path class="flow" d="M180 198 H530 V136"/>

  <rect class="node actor-node" x="50" y="64" width="130" height="70" rx="5"/>
  <text class="node-label" x="115" y="105">Browser</text>

  <rect class="node legacy-node" x="250" y="64" width="140" height="70" rx="5"/>
  <text class="node-label" x="320" y="105">Open WebUI</text>

  <rect class="node legacy-node" x="470" y="64" width="120" height="70" rx="5"/>
  <text class="node-label" x="530" y="93">LiteLLM</text>
  <text class="role-label" x="530" y="115">LLM proxy</text>

  <rect class="node provider-node" x="690" y="64" width="160" height="70" rx="5"/>
  <text class="node-label" x="770" y="93">LLM</text>
  <text class="node-label" x="770" y="115">Provider</text>

  <rect class="node actor-node" x="50" y="170" width="130" height="56" rx="5"/>
  <text class="node-label-small" x="115" y="193">Coding</text>
  <text class="node-label-small" x="115" y="214">Agent</text>

  <!-- (b) Integrated Novedu approach -->
  <rect class="panel" x="20" y="260" width="860" height="290" rx="8"/>
  <text class="panel-tag" x="42" y="289">(b)</text>
  <text class="panel-title" x="80" y="289">Novedu: integrated web app and LLM proxy</text>
  <!-- The three upper components share identical top and bottom coordinates. -->
  <line class="flow" x1="180" y1="379" x2="320" y2="379"/>
  <line class="flow" x1="620" y1="379" x2="690" y2="379"/>
  <path class="flow" d="M180 506 H470 V456"/>

  <rect class="node actor-node" x="50" y="304" width="130" height="150" rx="5"/>
  <text class="node-label" x="115" y="385">Browser</text>

  <rect class="node actor-node" x="50" y="478" width="130" height="56" rx="5"/>
  <text class="node-label-small" x="115" y="501">Coding</text>
  <text class="node-label-small" x="115" y="522">Agent</text>

  <rect class="node novedu-node" x="320" y="304" width="300" height="150" rx="7"/>
  <text class="node-label" x="470" y="328">Novedu Web App</text>
  <text class="role-label" x="470" y="349">Web application + LLM proxy</text>

  <rect class="activity" x="350" y="362" width="105" height="32" rx="4"/>
  <text class="activity-label" x="402.5" y="383">Tutor</text>

  <rect class="activity" x="485" y="362" width="105" height="32" rx="4"/>
  <text class="activity-label" x="537.5" y="383">Quizzes</text>

  <rect class="activity" x="350" y="402" width="105" height="32" rx="4"/>
  <text class="activity-label" x="402.5" y="423">Writing</text>

  <rect class="activity" x="485" y="402" width="105" height="32" rx="4"/>
  <text class="activity-label" x="537.5" y="423">Coding</text>

  <rect class="node provider-node" x="690" y="304" width="160" height="150" rx="5"/>
  <text class="node-label" x="770" y="368">LLM</text>
  <text class="node-label" x="770" y="390">Provider</text>
</svg>
